spring:
  application:
    name: fixflow-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/fixflow}
    username: ${DB_USERNAME:fixflow}
    password: ${DB_PASSWORD:fixflow}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:fixflow-super-secret-key-change-me-in-production}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
