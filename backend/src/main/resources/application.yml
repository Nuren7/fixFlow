spring:
  application:
    name: fixflow-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/fixflow
    username: fixflow
    password: fixflow
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

jwt:
  secret: "fixflow-super-secret-key-change-me-in-production"
  expiration-ms: 3600000

management:
  endpoints:
    web:
      exposure:
        include: health,info
